[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pmpp"
version = "0.1.6"
description = "PM++: a JAX-based differentiable multi-GPU Particle-Mesh cosmology simulator."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "rouzib" },
]
keywords = [
  "cosmology",
  "particle-mesh",
  "jax",
  "n-body",
  "multi-gpu",
  "differentiable-simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax[cuda12]>=0.4.7; sys_platform == 'linux' and platform_machine == 'x86_64'",
  "jax>=0.4.7; sys_platform != 'linux' or platform_machine != 'x86_64'",
  "h5py>=3.10,<4",
  "matplotlib>=3.8,<4",
  "mcfit>=0.0.18",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.4,<9",
  "myst-nb>=1.1,<2",
  "pydata-sphinx-theme>=0.15,<0.17",
  "sphinx-copybutton>=0.5,<1",
  "sphinx-design>=0.6,<1",
  "sphinxcontrib-mermaid>=2.1,<3",
  "matplotlib>=3.8,<4",
]
dev = [
  "build",
  "twine",
  "pytest",
]

[project.urls]
Homepage = "https://github.com/rouzib/PMpp"
Repository = "https://github.com/rouzib/PMpp"
Documentation = "https://pmpp-docs.readthedocs.io/en/latest/"
Issues = "https://github.com/rouzib/PMpp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pmpp"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/pmpp",
  "/cuda",
  "/scripts/build_cuda_routing.py",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]
