[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pmpp"
version = "0.1.6"
description = "PM++: a JAX-based differentiable multi-GPU Particle-Mesh cosmology simulator."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "rouzib" },
]
keywords = [
  "cosmology",
  "particle-mesh",
  "jax",
  "n-body",
  "multi-gpu",
  "differentiable-simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax>=0.4.7",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "mcfit>=0.0.18",
]

[project.scripts]
pmpp-build-cuda-routing = "pmpp.distributed:build_cuda_main"

[project.optional-dependencies]
docs = [
  "sphinx>=7.4,<9",
  "myst-nb>=1.1,<2",
  "pydata-sphinx-theme>=0.15,<0.17",
  "sphinx-copybutton>=0.5,<1",
  "sphinx-design>=0.6,<1",
  "sphinxcontrib-bibtex>=2.6,<3",
  "sphinxcontrib-mermaid>=2.1,<3",
]
dev = [
  "build",
  "twine",
  "pytest",
  "Pylians",
  "yapf==0.43.0",
]

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
disable_ending_comma_heuristic = true
split_before_named_assigns = false
dedent_closing_brackets = true
coalesce_brackets = true

[project.urls]
Homepage = "https://github.com/rouzib/PMpp"
Repository = "https://github.com/rouzib/PMpp"
Documentation = "https://pmpp-docs.readthedocs.io/en/latest/"
Issues = "https://github.com/rouzib/PMpp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pmpp", "benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
"cuda/CMakeLists.txt" = "pmpp/distributed/cuda/CMakeLists.txt"
"cuda/build_cuda_routing.py" = "pmpp/distributed/cuda/build_cuda_routing.py"
"cuda/route_kernels.cu" = "pmpp/distributed/cuda/route_kernels.cu"

[tool.hatch.build.targets.sdist]
include = [
  "/src/pmpp",
  "/benchmarks",
  "/cuda",
  "/scripts/build_cuda_routing.py",
  "/scripts/check_cuda_artifact.py",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]
