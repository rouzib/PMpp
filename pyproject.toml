[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "pmpp"
version = "0.2.1"
description = "PM++: a JAX-based differentiable multi-GPU Particle-Mesh cosmology simulator."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "rouzib" },
]
keywords = [
  "cosmology",
  "particle-mesh",
  "jax",
  "n-body",
  "multi-gpu",
  "differentiable-simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "jax>=0.9.1,<0.11",
  "h5py>=3.10",
  "matplotlib>=3.8",
  "mcfit>=0.0.18",
]

[project.scripts]
pmpp-build-cuda-routing = "pmpp.distributed:build_cuda_main"

[project.optional-dependencies]
docs = [
  "sphinx>=7.4,<9",
  "myst-nb>=1.1,<2",
  "pydata-sphinx-theme>=0.15,<0.17",
  "sphinx-copybutton>=0.5,<1",
  "sphinx-design>=0.6,<1",
  "sphinxcontrib-bibtex>=2.6,<3",
  "sphinxcontrib-mermaid>=2.1,<3",
]
dev = [
  "build",
  "dm-haiku>=0.0.17",
  "twine",
  "pytest",
  "pytest-cov>=6,<8",
  "hdf5plugin",
  "optax",
  "Pylians",
  "yapf==0.43.0",
]

[tool.pytest.ini_options]
filterwarnings = [
  "error::DeprecationWarning",
  "error::RuntimeWarning",
  # Haiku 0.0.17 uses these deprecated aliases only for JAX < 0.10.  They are
  # removed from Haiku's import path on JAX 0.10 and are not emitted by PM++.
  'ignore:jax\.core\.(take_current_trace|set_current_trace) is deprecated\.:DeprecationWarning:haiku\._src\.dot',
]
markers = [
  "gpu: requires one visible GPU",
  "gpu2: requires two visible GPUs",
  "logical4: validates four-device topology semantics",
  "hopper: requires a Hopper GPU and native sm_90 artifact",
  "gpu4: requires four H100 GPUs",
  "slow: production-scale scientific test",
]

[tool.coverage.run]
branch = true
source = ["pmpp"]

[tool.coverage.report]
fail_under = 90
show_missing = true

[tool.yapf]
based_on_style = "pep8"
column_limit = 120
disable_ending_comma_heuristic = true
split_before_named_assigns = false
dedent_closing_brackets = true
coalesce_brackets = true

[project.urls]
Homepage = "https://github.com/rouzib/PMpp"
Repository = "https://github.com/rouzib/PMpp"
Documentation = "https://pmpp-docs.readthedocs.io/en/latest/"
Issues = "https://github.com/rouzib/PMpp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pmpp", "benchmarks"]

[tool.hatch.build.targets.wheel.force-include]
"cuda/CMakeLists.txt" = "pmpp/distributed/cuda/CMakeLists.txt"
"cuda/build_cuda_routing.py" = "pmpp/distributed/cuda/build_cuda_routing.py"
"cuda/route_kernels.cu" = "pmpp/distributed/cuda/route_kernels.cu"

[tool.hatch.build.targets.sdist]
include = [
  "/src/pmpp",
  "/benchmarks",
  "/cuda",
  "/scripts/build_cuda_routing.py",
  "/scripts/check_cuda_artifact.py",
  "/README.md",
  "/LICENSE",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
]
